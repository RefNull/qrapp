<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Camera geometry probe</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: #123; }
  #app { position: relative; height: 100vh; height: 100dvh; width: 100%; }
  #stage { position: absolute; inset: 0; background: #000; overflow: hidden; }

  video {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    min-width: 100%; min-height: 100%;
    object-fit: cover;
    background: #000;
  }
  /* Mode A == exactly what ships today, transform included. */
  video.modeA { transform: translateZ(0); backface-visibility: hidden; }
  /* Mode B: identical, minus the transform I added. */
  video.modeB { }
  /* Mode C: no object-fit at all; JS sizes it to cover explicitly. */
  video.modeC {
    object-fit: fill;
    width: auto; height: auto; min-width: 0; min-height: 0;
    transform-origin: top left;
  }

  #out {
    position: absolute; left: 0; right: 0; top: 0;
    font: 11px/1.35 ui-monospace, Menlo, monospace;
    color: #0f0; background: rgba(0,0,0,0.82);
    padding: 6px 8px; white-space: pre; z-index: 5;
  }
  #btn {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: 28px; z-index: 6;
    padding: 14px 22px; font-size: 16px; font-weight: 600;
    border-radius: 999px; border: 0; background: #2866bd; color: #fff;
  }
  /* Deliberately vivid so any gap around the app box is obvious. */
  .edge { position: fixed; background: magenta; z-index: 4; }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <video id="v" playsinline muted autoplay></video>
  </div>
  <pre id="out">starting…</pre>
  <button id="btn" type="button">mode: A — tap to cycle</button>
</div>
<!-- Magenta hairlines at the true screen edges: anything between these and the
     black stage is area the app failed to cover. -->
<div class="edge" style="left:0;top:0;right:0;height:2px"></div>
<div class="edge" style="left:0;bottom:0;right:0;height:2px"></div>
<script>
const v = document.getElementById('v');
const out = document.getElementById('out');
const btn = document.getElementById('btn');
const modes = ['A', 'B', 'C'];
let mode = 0;

function probeInset(side) {
  const d = document.createElement('div');
  d.style.cssText = `position:fixed;height:env(safe-area-inset-${side},0px);`;
  document.body.appendChild(d);
  const px = d.getBoundingClientRect().height;
  d.remove();
  return px;
}
function probeUnit(unit) {
  const d = document.createElement('div');
  d.style.cssText = `position:fixed;height:100${unit};top:-99999px;`;
  document.body.appendChild(d);
  const px = d.getBoundingClientRect().height;
  d.remove();
  return px;
}

function applyMode() {
  v.className = 'mode' + modes[mode];
  btn.textContent = 'mode: ' + modes[mode] + ' — tap to cycle';
  if (modes[mode] === 'C') sizeToCover();
  else { v.style.width = ''; v.style.height = ''; v.style.transform = ''; }
}

// Explicit cover: compute the scale ourselves, trusting nothing about object-fit.
function sizeToCover() {
  if (modes[mode] !== 'C') return;
  const stage = document.getElementById('stage').getBoundingClientRect();
  const vw = v.videoWidth, vh = v.videoHeight;
  if (!vw || !vh) return;
  const scale = Math.max(stage.width / vw, stage.height / vh);
  const w = vw * scale, h = vh * scale;
  v.style.width = w + 'px';
  v.style.height = h + 'px';
  v.style.transform = `translate(${(stage.width - w) / 2}px, ${(stage.height - h) / 2}px)`;
}

btn.addEventListener('click', () => { mode = (mode + 1) % modes.length; applyMode(); });

function report() {
  const r = v.getBoundingClientRect();
  const app = document.getElementById('app').getBoundingClientRect();
  const cs = getComputedStyle(v);
  const vvp = window.visualViewport;
  out.textContent = [
    `mode          ${modes[mode]}`,
    `standalone    ${window.matchMedia('(display-mode: standalone)').matches} / nav=${navigator.standalone}`,
    `scheme        ${window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'}`,
    `dpr           ${devicePixelRatio}`,
    `screen        ${screen.width}x${screen.height}`,
    `inner         ${innerWidth}x${innerHeight}`,
    `docEl.client  ${document.documentElement.clientWidth}x${document.documentElement.clientHeight}`,
    `visualVP      ${vvp ? Math.round(vvp.width)+'x'+Math.round(vvp.height)+' scale='+vvp.scale.toFixed(2)+' offY='+Math.round(vvp.offsetTop) : 'n/a'}`,
    `100vh/100dvh  ${probeUnit('vh').toFixed(1)} / ${probeUnit('dvh').toFixed(1)}`,
    `safe t/b      ${probeInset('top').toFixed(1)} / ${probeInset('bottom').toFixed(1)}`,
    `#app rect     ${Math.round(app.width)}x${Math.round(app.height)} @${Math.round(app.left)},${Math.round(app.top)}`,
    `video rect    ${Math.round(r.width)}x${Math.round(r.height)} @${Math.round(r.left)},${Math.round(r.top)}`,
    `intrinsic     ${v.videoWidth}x${v.videoHeight}  readyState=${v.readyState}`,
    `computed      w=${cs.width} h=${cs.height}`,
    `object-fit    ${cs.objectFit}  pos=${cs.position}`,
    `transform     ${cs.transform}`,
    `track         ${trackInfo()}`,
  ].join('\n');
}

function trackInfo() {
  const t = v.srcObject && v.srcObject.getVideoTracks && v.srcObject.getVideoTracks()[0];
  if (!t) return 'none';
  const s = t.getSettings ? t.getSettings() : {};
  return `${s.width}x${s.height} fr=${s.frameRate} facing=${s.facingMode}`;
}

(async () => {
  try {
    v.srcObject = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false,
    });
    await v.play();
  } catch (e) {
    out.textContent = 'getUserMedia failed: ' + e;
    return;
  }
  applyMode();
  setInterval(report, 250);
  v.addEventListener('resize', sizeToCover);
  addEventListener('resize', sizeToCover);
  addEventListener('orientationchange', () => setTimeout(sizeToCover, 300));
})();
</script>
</body>
</html>
